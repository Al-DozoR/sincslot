openapi: 3.0.0
info:
  title: API регистрации компании
  version: 1.0.1
  description: |
    Метод для регистрации компании в приложении бронирования услуг.
    После регистрации владелец компании может входить в систему по email и паролю.
paths:
  /auth/register-company:
    post:
      summary: Регистрация компании
      description: |
        Создаёт новую компанию и аккаунт владельца.
        Аккаунт владельца является единственным администратором компании.
      tags:
        - Авторизация и регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - email
                - phone
                - password
                - password_repeat
              properties:
                name:
                  type: string
                  example: "Салон красоты 'Ирис'"
                  description: "Название компании"
                address:
                  type: string
                  example: "г. Екатеринбург, ул. Кирова, 20"
                  description: "Адрес компании"
                email:
                  type: string
                  format: email
                  example: "owner@company.com"
                  description: "Email владельца (используется для входа и восстановления пароля)"
                phone:
                  type: string
                  example: "+7 900 555-22-11"
                  description: "Телефон компании"
                password:
                  type: string
                  example: "MySecretPassword123"
                  description: "Пароль владельца компании"
                password_repeat:
                  type: string
                  example: "MySecretPassword123"
                  description: "Повтор пароля"
      responses:
        '201':
          description: Компания успешно зарегистрирована
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id:
                    type: string
                    example: "b1cde972-1c11-4d44-9a77-012345678abc"
                  owner_id:
                    type: string
                    example: "e91a7d04-bb76-4b6b-87e1-abcdef123456"
                  message:
                    type: string
                    example: "Компания успешно зарегистрирована"
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Пароли не совпадают"
        '409':
          description: Компания или владелец с таким email уже зарегистрированы
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Email уже используется"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Ошибка сервера"
